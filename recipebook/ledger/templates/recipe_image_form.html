{% extends 'base.html' %}

{% block content %}
    <h2>Upload Image for {{ recipe.name }}</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>

    <p><a href="{% url 'ledger:recipe-detail' recipe.pk %}">Back to Recipe</a></p>
{% endblock %}
