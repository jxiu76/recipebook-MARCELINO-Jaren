{% extends 'base.html' %}

{% load static %}

{% block content %}
<h1>Recipes</h1>

{% if user.is_authenticated %}
    <a href="{% url 'ledger:recipe-add' %}">Add New Recipe</a>
{% endif %}

<ul>
    {% for recipe in object_list %}
        <li><a href="{{ recipe.get_absolute_url }}"> {{ recipe.name }} </a></li>
    {% empty %}
        <li>No recipes available.</li>
    {% endfor %}
</ul>

{% endblock %}
